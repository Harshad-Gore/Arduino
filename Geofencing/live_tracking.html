<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Live Tracking Visualization</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <style>
        #map {
            height: 350px;
            width: 100%;
            margin-bottom: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            border: 1px solid #ccc;
            padding: 6px;
            text-align: center;
        }

        th {
            background: #f0f0f0;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
    </style>
</head>

<body>
    <h2>Live GPS Tracking Visualization</h2>
    <div id="map"></div>
    <h3>Recent Logs</h3>
    <table id="logTable">
        <thead>
            <tr>
                <th>Timestamp</th>
                <th>Latitude</th>
                <th>Longitude</th>
                <th>Distance (m)</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>
    <script>
        var firebaseConfig = {
            apiKey: "AIzaSyAgl1Gsq2Pvw4ePYDvbcD23aINWjJK0_ig",
            authDomain: "homearrestsystem.firebaseapp.com",
            projectId: "homearrestsystem",
            storageBucket: "homearrestsystem.firebasestorage.app",
            messagingSenderId: "242988605869",
            appId: "1:242988605869:web:c76116ad198a118ac40124",
            measurementId: "G-YXJFD5Y0LZ"
        };
        firebase.initializeApp(firebaseConfig);
        var db = firebase.database();

        // Map setup
        var map = L.map('map').setView([18.6748823, 73.8917839], 17);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
        }).addTo(map);
        var homeMarker = L.marker([18.6748823, 73.8917839]).addTo(map).bindPopup('Home Location').openPopup();
        var personMarker = null;
        var circle = L.circle([18.6748823, 73.8917839], { radius: 220, color: 'red', fillOpacity: 0.1 }).addTo(map);

        function updateMap(lat, lng, status) {
            if (personMarker) map.removeLayer(personMarker);
            personMarker = L.marker([lat, lng], { icon: status === 'NORMAL' ? undefined : L.icon({ iconUrl: 'https://cdn-icons-png.flaticon.com/512/565/565547.png', iconSize: [32, 32] }) }).addTo(map);
            map.setView([lat, lng], 17);
        }

        function updateTable(logs) {
            var tbody = document.querySelector('#logTable tbody');
            tbody.innerHTML = '';
            logs.forEach(function (log) {
                var tr = document.createElement('tr');
                tr.innerHTML = `<td>${log.timestamp}</td><td>${log.latitude}</td><td>${log.longitude}</td><td>${log.distance}</td><td>${log.status}</td>`;
                tbody.appendChild(tr);
            });
        }

        // Listen for new logs
        db.ref('tracking_logs').limitToLast(10).on('value', function (snapshot) {
            var logs = [];
            snapshot.forEach(function (child) {
                logs.push(child.val());
            });
            logs.reverse();
            if (logs.length > 0) {
                var latest = logs[0];
                updateMap(latest.latitude, latest.longitude, latest.status);
            }
            updateTable(logs);
        });
    </script>
</body>

</html>
